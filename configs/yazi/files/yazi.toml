# yazi — file manager with inline image/PDF previews.
# PDF previews need `poppler` (pdftoppm); chafa is the fallback for
# terminals without a graphics protocol.
# Markdown previews use the vendored glow.yazi plugin (see below).

[opener]
edit     = [{ run = 'hx "$@"',   block = true }]
text     = [{ run = 'hx "$@"',   block = true }]
markdown = [{ run = 'glow "$@"', block = true }]
pdf      = [{ run = 'open "$@"', orphan = true }]
image    = [{ run = 'open "$@"', orphan = true }]

[preview]
max_width = 1000
max_height = 1000

# Markdown previews render through glow (One Light theme, see configs/glow),
# via the vendored glow.yazi plugin in this dir. The plugin passes
# CLICOLOR_FORCE=1 and -s="$GLOW_STYLE" (see its main.lua header for why).
[[plugin.prepend_previewers]]
url = "*.{md,mdown,mkdn,mkd,markdown}"
run = "glow"

[manager]
ratio = [1, 3, 4]
