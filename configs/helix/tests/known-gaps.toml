# Accepted Helix-vs-Zed differences for configs/helix/tests/parity.py.
#
# Each entry is a (language, Zed capture, Helix color) group the theme can't
# fix: Helix uses one scope where Zed uses two, and the color that matches
# more characters across languages wins. `count` is how many characters the
# group covered when accepted. A group not listed here, or one that grows past
# its count, fails the test. When a theme change shrinks a group, the test
# prints a note: lower the count (or delete the entry) to lock in the gain.

# python
[[gap]]
lang = "python"
zed = "function.kwargs"
helix = "#e0def4"
count = 32  # frozen default_factory encoding key
reason = "Helix captures keyword-argument names as plain `variable`."

[[gap]]
lang = "python"
zed = "keyword.operator"
helix = "#c4a7e7"
count = 23  # in and not is or
reason = "`keyword.operator` stays magenta for JS typeof/instanceof and Rust `as` (more chars)."

[[gap]]
lang = "python"
zed = "variable.parameter"
helix = "#e0def4"
count = 22  # url timeout kwargs points
reason = "Parameter declarations are plain: Helix colors parameter uses too, and plain wins overall."

[[gap]]
