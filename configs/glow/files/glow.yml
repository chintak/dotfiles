# glow — rendered markdown in the terminal.
# theme: One Light, matching hx's `onelight` (see onelight.json in this dir).
# glow reads ~/Library/Preferences/glow/glow.yml on macOS and cannot expand ~
# in style paths, so zshrc pins GLOW_STYLE/GLAMOUR_STYLE to onelight.json;
# `auto` here is just the fallback when those env vars are absent.
style: auto
width: 100
pager: true
# mouse wheel support (TUI-mode only)
mouse: true
# show all files, including hidden and ignored (TUI-mode only)
all: true
# show line numbers (TUI-mode only)
showLineNumbers: true
