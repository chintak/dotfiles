# Helix language servers. Only pin what auto-detect gets wrong.
# Helix finds `pyright`/`ruff`/`gopls`/`rust-analyzer`/`lua-language-server` on PATH.

# Helix 25.x's builtin rust entry has no formatter; rustfmt is on PATH via
# rustup, so format-on-save needs it pinned here.
[[language]]
name = "rust"
formatter = { command = "rustfmt" }

# Workspace symbol search (space s). rust-analyzer defaults to types only
# (OnlyTypes, so fn/const show up only when no type matches) and already
# skips symbols inside std/dependencies (scope = workspace) -- though their
# crate names still match, as `package` rows (filter with `%kind !package`).
# Search all symbol kinds in the workspace crates, and drop `use` re-exports
# so a symbol lists once, at its definition.
# Keys: rust-analyzer crates/rust-analyzer/src/config.rs.
[language-server.rust-analyzer.config.workspace.symbol.search]
scope = "workspace"
kind = "all_symbols"
excludeImports = true

# Format on save = ruff autofix, then ruff format. A `formatter` takes
# precedence over LSP formatting (docs.helix-editor.com/languages.html).
# Helix runs it in the file's directory (helix-view/src/document.rs:833-835),
# so ruff finds the nearest pyproject.toml/ruff.toml by walking up. That
# project config decides which rules autofix; with none, ruff's defaults apply.
# --exit-zero: lint findings that can't be fixed must not abort the save.
# If the file has a syntax error, ruff format exits non-zero and Helix keeps
# the buffer as it is.
[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
formatter = { command = "sh", args = ["-c", "ruff check --fix --exit-zero --quiet - | ruff format --quiet -"] }

[[language]]
name = "lua"
language-servers = ["lua-language-server"]

# Markdown writing: continue lists/quotes on Enter.
# Declaring these as comment-tokens makes Helix's continue-comments (default
# on) repeat the marker of the previous line when Enter is pressed inside a
# list item or blockquote — bullets, task boxes and quotes continue
# automatically. Trade-offs (helix discussion #12812):
#   - numbered lists repeat "1." each time instead of incrementing to 2.,
#     3., ... (markdown renderers normalize it, but the source reads odd)
#   - space c now toggles "-" line comments on markdown instead of HTML
#     comments; space C (block comment) is unaffected
# Markdown writing stack:
#   marksman  — headings/links LSP (auto-detected on PATH, pinned here anyway)
#   prettier  — formatter on save (editor.auto-format is on by default);
#               proseWrap=preserve so manual line breaks survive
# Note: harper-ls (spell/grammar) was removed — helix 25.07's builtin
# language-server definition sends a settings payload harper 2.x rejects
# ("Settings must be an object"), erroring on every markdown buffer.
[[language]]
name = "markdown"
comment-tokens = ["-", "+", "*", "1.", "> ", "- [ ]"]
language-servers = ["marksman"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }
