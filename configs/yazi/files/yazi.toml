# yazi — file manager with inline image/PDF previews.
# PDF previews need `poppler` (pdftoppm); chafa is the fallback for
# terminals without a graphics protocol.
# Markdown previews use the vendored piper.yazi plugin + glow (see below).

[opener]
edit     = [{ run = 'hx "$@"',   block = true }]
text     = [{ run = 'hx "$@"',   block = true }]
markdown = [{ run = 'glow "$@"', block = true }]
pdf      = [{ run = 'open "$@"', orphan = true }]
image    = [{ run = 'open "$@"', orphan = true }]

[preview]
max_width = 1000
max_height = 1000

# Markdown previews render through glow (One Light theme, see configs/glow).
# piper runs `sh -c` with a non-tty stdout, so CLICOLOR_FORCE=1 is needed for
# glow to emit color, and the style must be passed explicitly (`-s=`) —
# GLOW_STYLE alone doesn't mark the flag as changed and glow falls back to
# notty. PAGER=cat bypasses the `pager: true` in glow.yml inside the preview.
[[plugin.prepend_previewers]]
url = "*.{md,mdown,mkdn,mkd,markdown}"
run = 'piper -- PAGER=cat CLICOLOR_FORCE=1 glow -w=$w -s="${GLOW_STYLE:-dark}" "$1"'

[manager]
ratio = [1, 3, 4]
