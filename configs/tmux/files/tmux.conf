# tmux — durable sessions for long-running jobs (herdr owns interactive work).
# Dracula, text-only status line so it renders identically on Ghostty and Termius.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 200000
set -g mouse on
set -g focus-events on
set -g escape-time 0                 # don't eat keys in modal TUIs
set -g set-clipboard on
set -sg extended-keys on
setw -g aggressive-resize on
set -g detach-on-destroy off
setw -g monitor-activity on
set -g visual-activity off

set -g status-style 'bg=#282a36 fg=#f8f8f2'
set -g status-left  ' #[bold]#S '
set -g status-right ' #{?pane_in_mode,[copy],}#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null)  %H:%M '
set -g window-status-current-style 'bg=#bd93f9 fg=#282a36 bold'

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display 'reloaded'

set -g pane-border-status top
set -g pane-border-format ' #{pane_index} #{pane_current_command} #{pane_title} '
