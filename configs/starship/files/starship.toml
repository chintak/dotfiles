"$schema" = 'https://starship.rs/config-schema.json'

# Desktop prompt (powerline, Dracula). The SSH/iOS twin is
# starship.mobile.toml — keep the two in sync when adding a module.
# Only the modules this machine actually reports.

palette = 'dracula'

format = """
[\ue0b6](fg:color_purple)\
[ $directory ](fg:color_fg0 bg:color_purple)\
[\ue0b0](fg:color_purple bg:color_aqua)\
[ \ue0a0 $git_branch$git_status ](fg:color_fg0 bg:color_aqua)\
[\ue0b0](fg:color_aqua bg:color_blue)\
[ py$python js$nodejs rs$rust ](fg:color_fg0 bg:color_blue)\
[\ue0b0](fg:color_blue)\
$line_break$character"""

[palettes.dracula]
color_fg0    = '#f8f8f2'
color_bg1    = '#282a36'
color_blue   = '#6272a4'
color_aqua   = '#8be9fd'
color_green  = '#50fa7b'
color_orange = '#ffb86c'
color_purple = '#bd93f9'
color_red    = '#ff5555'
color_yellow = '#f1fa8c'

[directory]
style = "fg:color_fg0 bg:color_purple"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:color_fg0 bg:color_aqua"
format = "[$symbol$branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "fg:color_fg0 bg:color_aqua"
format = "[$all_status$ahead_behind]($style)"

[python]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = "[$symbol$version ]($style)"

[nodejs]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = "[$symbol$version ]($style)"

[rust]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = "[$symbol$version ]($style)"

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
