"$schema" = 'https://starship.rs/config-schema.json'

# Desktop prompt — TokyoNight powerline path pill + flat conditional tags on
# line 1; transient state (exit code, duration, jobs) on line 2.
# The SSH/iOS twin is starship.mobile.toml — keep the two in sync when
# adding a module. Only the modules this machine actually reports.
#
# Why flat after the pill: literals in the top-level `format` render even
# when their module is empty — the old config always drew a bare branch
# pill and " py js rs " labels. Module formats only render while the module
# is inactive → nothing at all, so labels and padding live inside each
# module's [ … ] textgroup. Conditional ( … ) groups are used only where a
# module stays active while its data is empty (a clean git status).
# Caveat: never wrap starship meta-variables ($state) in ( … ) — the
# renderer recurses into their text and finds no variables, so they hide.

palette = 'tokyonight'

format = """
[](fg:color_purple)\
[ $directory ](fg:color_fg0 bg:color_purple)\
[](fg:color_purple)\
$git_branch$git_status$git_state$python$nodejs$rust\
$line_break$status$cmd_duration$jobs\
$character"""

[palettes.tokyonight]
color_fg0    = '#c0caf5'
color_bg1    = '#1a1b26'
color_blue   = '#7aa2f7'
color_aqua   = '#7dcfff'
color_green  = '#9ece6a'
color_orange = '#ff9e64'
color_purple = '#bb9af7'
color_red    = '#f7768e'
color_yellow = '#e0af68'

[directory]
style = "bold fg:color_fg0 bg:color_purple"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold fg:color_aqua"
format = "[ $symbol$branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "fg:color_yellow"
format = "[( $all_status$ahead_behind)]($style)"

# Mid-operation state (REBASING 2/3, MERGING …) — rare, loud on purpose.
# No conditional around $state (meta-variable, see header); the progress
# conditional uses plain variables so it hides cleanly during a merge.
[git_state]
style = "bold fg:color_orange"
format = "[ $state( $progress_current/$progress_total) ]($style)"

# Language tags only appear inside their own projects (labels moved into
# the module so a plain directory renders no "py js rs" dead labels).
[python]
symbol = "py "
style = "fg:color_blue"
format = "[ $symbol$version]($style)"

[nodejs]
symbol = "js "
style = "fg:color_blue"
format = "[ $symbol$version]($style)"

[rust]
symbol = "rs "
style = "fg:color_blue"
format = "[ $symbol$version]($style)"

# Line 2 — only renders when noteworthy. Numeric exit codes are gold in an
# agentic workflow: 101 = Rust test failure, 127 = typo, 139 = segfault.
# status is disabled by default in starship — opt in explicitly.
[status]
disabled = false
symbol = "✗ "
success_symbol = ""
not_executable_symbol = "✗ "
not_found_symbol = "✗ "
sigint_symbol = "✗ "
signal_symbol = "⚡ "
style = "bold fg:color_red"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "dimmed fg:color_yellow"
format = "took [$duration]($style) "

[jobs]
style = "bold fg:color_blue"
format = "[$symbol$number]($style) "

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
