# Dayfox (light) / Duskfox (dark), matched to Zed's nvim-nightfox themes and
# Rex. Yazi picks the flavor from the terminal's dark/light mode. Colors,
# including the row highlight and git.yazi signs, live in the flavors under
# files/flavors/; only mode-independent overrides belong here.
[flavor]
dark  = "duskfox"
light = "dayfox"

[status]
# No powerline glyphs in this setup.
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
