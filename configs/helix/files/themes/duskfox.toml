# Duskfox — matched to Zed's nvim-nightfox "Duskfox" theme and Rex.
# Reuses Helix's built-in `nightfox` theme (an adaptation of EdenEast's
# nightfox.nvim) for every scope and swaps in the Duskfox palette. Values come
# from Zed's nvim-nightfox extension; bg3 (cursor line) is Zed's active-line
# overlay (#433c59 at 34%) flattened onto the background.
inherits = "nightfox"

# Syntax: nightfox's scope choices differ from Zed's. These overrides make
# code render as it does in Zed, where each language's Zed grammar feeds the
# Duskfox theme's syntax colors: one magenta for every keyword, yellow types
# and enum variants, blue fields, plain module paths, lifetimes and
# parameters. Where Helix uses one scope for things Zed colors differently,
# the color matching more characters across Python, Markdown, YAML, TOML,
# Rust, JavaScript, Swift, Go, C and C++ wins. tests/parity.py measures this
# and tests/known-gaps.toml records what remains.
"keyword.control" = { fg = "magenta" }
"keyword.control.conditional" = { fg = "magenta" }
"keyword.control.repeat" = { fg = "magenta" }
"keyword.control.import" = { fg = "magenta" }
"keyword.control.return" = { fg = "magenta" }
"keyword.control.exception" = { fg = "magenta" }
"keyword.function" = { fg = "magenta" }
"keyword.storage.modifier" = { fg = "magenta" }
"keyword.storage.modifier.ref" = { fg = "fg2" }  # `&` in `&str`: an operator in Zed
"keyword.special" = { fg = "magenta" }
"keyword.operator" = { fg = "magenta" }          # as, typeof, instanceof, and/or/not
"type.builtin" = { fg = "yellow" }
"type.enum.variant" = { fg = "yellow" }
"constructor" = { fg = "yellow" }
"attribute" = { fg = "blue", modifiers = ["italic"] }
"namespace" = { fg = "fg1" }                     # module paths: plain in Python/Rust
"label" = { fg = "fg1" }                         # lifetimes
"variable.parameter" = { fg = "fg1" }
"variable.other.member" = { fg = "blue" }
"constant.builtin.boolean" = { fg = "orange-bright" }
"constant.character.escape" = { fg = "orange-bright" }
"string.special" = { fg = "cyan-bright" }
"comment.line.documentation" = { fg = "comment" }
"comment.block.documentation" = { fg = "comment" }
"punctuation.special" = { fg = "cyan-bright" }

# Markdown: Zed's markup colors.
"markup.heading" = { fg = "blue-bright", modifiers = ["bold"] }
"markup.bold" = { fg = "red", modifiers = ["bold"] }
"markup.italic" = { fg = "red", modifiers = ["italic"] }
"markup.strikethrough" = { fg = "cyan-bright", modifiers = ["crossed_out"] }
"markup.raw.inline" = { fg = "cyan-bright" }
"markup.link" = { fg = "blue-bright" }
"markup.link.url" = { fg = "orange-bright", modifiers = ["italic"] }
"markup.quote" = { fg = "fg1" }
"markup.list" = { fg = "cyan-bright" }
"markup.list.checked" = { fg = "fg1" }
"markup.list.unchecked" = { fg = "fg1" }

