[mgr]
prepend_keymap = [
	{ on = "<Enter>", run = "open",        desc = "Open (hx / rich / system)" },
	{ on = "e",       run = "open --hovered", desc = "Edit in Helix" },
	{ on = "y",       run = "copy --hovered path", desc = "Yank path" },
	# Official plugins (vendored in plugins/, yazi-rs/plugins@7200d73).
	# All prepend, so each wins over the shipped preset (verified against
	# keymap-default.toml); shadows documented in README.
	{ on = [ "g", "c" ], run = "plugin vcs-files", desc = "Show Git file changes" },
	{ on = "l",          run = "plugin smart-enter", desc = "Enter dir, or open file" },
	{ on = "f",          run = "plugin jump-to-char", desc = "Jump to file by first char" },
	{ on = "T",          run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
	{ on = "i",          run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
	{ on = "<C-p>",      run = "plugin diff", desc = "Diff selected with hovered (copy patch)" },
	# mux.yazi + duckdb.yazi (vendored in plugins/).
	{ on = "M",          run = "plugin mux next", desc = "Cycle mux previewers (duckdb / rich / code)" },
	# duckdb column scroll — shadows the preset H/L (back/forward history);
	# see the README for the rationale.
	{ on = "H",          run = "plugin duckdb -1", desc = "Preview: scroll one column left (shadows back)" },
	{ on = "L",          run = "plugin duckdb +1", desc = "Preview: scroll one column right (shadows forward)" },
]
