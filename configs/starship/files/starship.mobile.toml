"$schema" = 'https://starship.rs/config-schema.json'

# Mobile prompt — used over SSH (Termius on iOS). Glyph-free on purpose:
# Nerd Font icons live in the Private Use Area, which has no OS fallback,
# so a client whose font lacks them renders tofu boxes. One line, no right
# prompt, no os/user/time — a right prompt wraps badly at ~43 columns.
# Desktop twin: starship.toml.

add_newline = false
command_timeout = 1000
palette = 'dracula'
format = "$directory$git_branch$git_status$python$nodejs$rust$character"

[palettes.dracula]
color_fg0    = '#f8f8f2'
color_cyan   = '#8be9fd'
color_green  = '#50fa7b'
color_purple = '#bd93f9'
color_red    = '#ff5555'
color_yellow = '#f1fa8c'

[directory]
style = "bold fg:color_cyan"
format = "[$path]($style) "
truncation_length = 2
truncate_to_repo = true
read_only = " RO"
repo_root_style = "bold fg:color_cyan"

[git_branch]
symbol = "git:"
style = "bold fg:color_purple"
format = "[$symbol$branch]($style) "
truncation_length = 28
truncation_symbol = "…"

[git_status]
style = "fg:color_yellow"
format = "[$all_status$ahead_behind]($style) "
conflicted = "="
ahead = ">"
behind = "<"
diverged = "<>"
untracked = "?"
modified = "!"
staged = "+"
renamed = "R"
deleted = "x"

[python]
symbol = "py "
style = "fg:color_yellow"
format = "[$symbol$version ]($style)"

[nodejs]
symbol = "js "
style = "fg:color_green"
format = "[$symbol$version ]($style)"

[rust]
symbol = "rs "
style = "fg:color_red"
format = "[$symbol$version ]($style)"

[character]
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
