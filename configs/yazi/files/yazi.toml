# yazi — file manager with inline image/PDF previews.
# PDF previews need `poppler` (pdftoppm); chafa is the fallback for
# terminals without a graphics protocol.
# Markdown previews use the vendored piper.yazi plugin + glow (see below).

# Openers use the `%s` shell formatting (yazi >=26 deprecated `$n`/`$@` —
# unexpanded `$@` left hx launching with no file, i.e. a scratch buffer).
# yazi shell-quotes the substituted paths itself, so no surrounding quotes.
[opener]
edit     = [{ run = 'hx %s',   block = true }]
text     = [{ run = 'hx %s',   block = true }]
markdown = [{ run = 'glow %s', block = true }]
pdf      = [{ run = 'open %s', orphan = true }]
image    = [{ run = 'open %s', orphan = true }]

[preview]
max_width = 1000
max_height = 1000

# Markdown previews render through glow (One Light theme, see configs/glow)
# via the official piper.yazi plugin (vendored in this dir). Piper runs
# `sh -c` with a non-tty stdout, so the command needs CLICOLOR_FORCE=1 to
# emit color, and the style passed via -s explicitly — an env-set style
# alone doesn't mark glow's flag as changed and glow falls back to notty.
# GLOW_STYLE is pinned here (not inherited) so the theme survives yazi being
# launched from any env that lacks the zshrc export; $HOME is expanded by the
# `sh -c` piper spawns, so the path must be inline (a prefix env assignment
# wouldn't be visible to -s expansion on the same command line).
# PAGER=cat bypasses the `pager: true` in glow.yml inside the preview.
[[plugin.prepend_previewers]]
url = "*.{md,mdown,mkdn,mkd,markdown}"
run = 'piper -- PAGER=cat CLICOLOR_FORCE=1 glow -w=$w -s="$HOME/.config/glow/onelight.json" "$1"'

[mgr]
ratio = [1, 3, 4]
# show hidden/dotfiles by default (toggle with . in the TUI)
show_hidden = true
