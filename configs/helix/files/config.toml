# Helix — LSP and file editing inside panes. Auto-detects servers on PATH.
theme = "gruvbox"

[editor]
line-number = "relative"
bufferline = "multiple"
color-modes = true
cursorline = true

[editor.lsp]
display-inlay-hints = true

[editor.indent-guides]
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"

# ── macOS-style word/line motion ──────────────────────────────────────
# Ghostty sends xterm CSI for alt+arrows and Home/End for cmd+arrows
# (see ghostty/config); herdr forwards both untouched to the pane.
# home/end already work in insert mode by default; normal mode gets
# explicit bindings so cmd+arrows work there too. This overrides the
# tree-sitter select_prev/next_sibling on A-left/A-right in normal mode.
#
# S-A-left/right are bound to the same motion as a fallback: inside herdr
# they never reach the pane (herdr owns shift+alt+left/right for tab
# focus), but running hx outside herdr (or if a chord ever leaks through)
# behaves like plain word motion instead of something surprising.
#
# Shadow map — these Helix normal-mode Alt chords never reach hx inside a
# herdr pane because herdr captures them first (use Helix's Ctrl-w window
# mode for in-pane splits instead of herdr's alt+d):
#   alt+d → herdr split_vertical   (hx: delete_selection_noyank)
#   alt+u → herdr cycle_pane_next  (hx: earlier)
#   alt+i → herdr cycle_pane_previous (hx: shrink_selection)
#   alt+n → herdr new_tab          (hx: select_next_sibling)
# Insert-mode Alt-d / Alt-Backspace (delete word) and prompt-mode Alt-b /
# Alt-f are NOT captured by herdr and work normally.
[keys.insert]
"A-left" = "move_prev_word_start"
"A-right" = "move_next_word_start"
"S-A-left" = "move_prev_word_start"
"S-A-right" = "move_next_word_start"

[keys.normal]
"A-left" = "move_prev_word_start"
"A-right" = "move_next_word_start"
"S-A-left" = "move_prev_word_start"
"S-A-right" = "move_next_word_start"
"home" = "goto_line_start"
"end" = "goto_line_end"
# No `editor.auto-reload` exists upstream (helix#1125); agents editing
# files out from under hx need a manual pull. F5 reloads all buffers.
"F5" = ":reload-all"
